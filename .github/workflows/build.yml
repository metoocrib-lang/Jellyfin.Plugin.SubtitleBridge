name: Build and publish Jellyfin 12.2 experimental plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jellyfin-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      archive: Moonfin.SubtitleBridge_0.8.0.0_jf12.2.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate Jellyfin admin UI JavaScript
        run: python scripts/check_config_js.py
      - name: Test live Sonarr and Radarr search filter
        run: node scripts/test_catalog_filter.cjs
      - name: Check episode mapping rules
        run: dotnet run --project tests/EpisodeMapping.Tests/EpisodeMapping.Tests.csproj
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SubtitleBridge/Jellyfin.Plugin.SubtitleBridge.csproj
      - name: Build
        run: dotnet build Jellyfin.Plugin.SubtitleBridge/Jellyfin.Plugin.SubtitleBridge.csproj --no-restore --configuration Release
      - name: Create ZIP for Jellyfin
        shell: bash
        run: |
          mkdir -p dist/package
          test -s Jellyfin.Plugin.SubtitleBridge/bin/Release/net10.0/Jellyfin.Plugin.SubtitleBridge.dll
          cp Jellyfin.Plugin.SubtitleBridge/bin/Release/net10.0/Jellyfin.Plugin.SubtitleBridge.dll dist/package/
          (cd dist/package && zip -9 -j ../Moonfin.SubtitleBridge_0.8.0.0_jf12.2.zip Jellyfin.Plugin.SubtitleBridge.dll)
          unzip -t dist/Moonfin.SubtitleBridge_0.8.0.0_jf12.2.zip
          md5sum dist/Moonfin.SubtitleBridge_0.8.0.0_jf12.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: moonfin-jellyfin-12.2-test
          path: dist/Moonfin.SubtitleBridge_0.8.0.0_jf12.2.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: moonfin-jellyfin-12.2-test
          path: dist
      - name: Publish test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.8.0.0
        shell: bash
        run: |
          set -euo pipefail
          ZIP=dist/Moonfin.SubtitleBridge_0.8.0.0_jf12.2.zip
          test -s "$ZIP"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG - Jellyfin 12.2 experimental" --prerelease --notes "Nueva función Procesar un episodio desde Jellyfin y filtro instantáneo de series de Sonarr y películas de Radarr."
          else
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$ZIP")"
            mkdir -p dist/released
            gh release download "$TAG" --pattern "$(basename "$ZIP")" --dir dist/released --clobber
            # The checksum must refer to the exact released bytes, not a newly rebuilt ZIP.
            cp "dist/released/$(basename "$ZIP")" "$ZIP"
          fi
      - name: Write plugin repository catalog
        env:
          ARCHIVE: dist/Moonfin.SubtitleBridge_0.8.0.0_jf12.2.zip
          TAG: v0.8.0.0
        run: python scripts/publish_manifest.py
      - name: Commit catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Jellyfin 12.2 experimental catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
